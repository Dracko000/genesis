[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis"
version = "0.1.0"
description = "An experimental research prototype for experience-driven representation learning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Genesis Research" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.6,<3.0",
    "torch>=2.2,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "hypothesis>=6.98,<7.0",
    "pytest>=8.0,<9.0",
]
ui = []

[tool.setuptools.packages.find]
where = ["."]
include = ["genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: longer research-style runs, excluded from the default suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"
